<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Source Map 还原示例</title>
    <style>
      body { font: 14px/1.7 -apple-system, "PingFang SC", sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
      code { background: #f5f5f5; padding: 1px 4px; border-radius: 4px; }
      pre { background: #f7f7f7; padding: 12px; border-radius: 6px; overflow: auto; }
    </style>
  </head>
  <body>
    <h1>Source Map 还原示例</h1>
    <p>
      本页加载的是<strong>压缩后</strong>的 <code>dist/app.min.js</code>（配套生成了 .map）。
      页面里的代码故意抛错，SDK 上报的堆栈只会是 <code>app.min.js:1:xxxx</code>。
    </p>
    <p>用下面这条命令就能把它还原到源码位置：</p>
    <pre>node scripts/symbolicate.mjs \
  --report reports/monitoring-lab/monitoring-sdk-report.jsonl \
  --map demo/sourcemap/dist/app.min.js.map \
  --app monitor-demo-sourcemap</pre>
    <button id="btn-error">再抛一次错误</button>

    <script>
      window.__MONITOR_CONFIG__ = {
        dsn: location.protocol + '//' + location.hostname + ':8398/report',
        appName: 'monitor-demo-sourcemap',
        debug: true
      }
      document.getElementById('btn-error').addEventListener('click', function () {
        window.__sourcemapDemoRun()
      })
    </script>
    <script src="/dist/monitor.iife.js"></script>
    <script src="./dist/app.min.js"></script>
  </body>
</html>
